[project]
name = "agenticlangraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kamal Shah", email = "shahkamal2283@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.3.15",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.5.1",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langsmith>=0.11.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
agenticlangraph = "agenticlangraph:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
